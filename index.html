<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Admin Dashboard - TOP</title>
</head>
<body>
    <div class="container">

      <div class="top-bar">
        <div class="search">
          <img src="./src/images/magnify.svg" alt="Search icon">
          <input type="text" name="search" id="search" placeholder="How to not have health inspector hate you?">
        </div>
        <div class="act-info">
          <img src="/src/images/bell-badge.svg" alt="Notification icon">
          <img id="pfp" src="./src/images/default_pfp/coder_laptop.png" alt="User profile picture"> 
          <p class="username">Silas Schlax</p>
        </div>
        <div class="prof-info">
          <img src="./src/images/default_pfp/coder_laptop.png" alt="User profile picture"> 
            <div class="info">
              <p>Hi there,</p>
              <span>Silas Schlax (@septimus)</span>
            </div>
        </div>
        <nav class="actions">
          <button class="new">New</button>
          <button class="upload">Upload</button>
          <button class="share">Share</button>
        </nav>
      </div>

      <div class="sidebar">
        <div class="title">
          <a href="/">
            <img src="./src/images/view-dashboard.svg" alt="view-dashboard icon">
            <p>Dashboard</p>
          </a>
        </div>
        <div class="groups">
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/home.svg" alt="home icon">
              <p>Home</p>
            </a>
          </div>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/card-account-details.svg" alt="profile icon">
              <p>Profile</p>
            </a>
          </div>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/message-processing.svg" alt="messages icon">
              <p>Messages</p>
            </a>
          </div>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/history.svg" alt="history icon">
              <p>History</p>
            </a>
          </div>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/clipboard-list.svg" alt="tasks icon">
              <p>Tasks</p>
            </a>
          </div>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/account-group.svg" alt="communities icon">
              <p>Communities</p>
            </a>
          </div>
        </div>
        <div class="groups">
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/cog.svg" alt="settings icon">
              <p>Settings</p>
            </div>
          </a>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/face-agent.svg" alt="support icon">
              <p>Support</p>
            </div>
          </a>
          <div class="group">
            <a href="#">
              <img class="nav-icon" src="./src/images/shield-check.svg" alt="privacy icon">
              <p>Privacy</p>
            </div>
          </a>
        </div>
      </div>

      <div class="content">
        <div class="projects">
          <h1>projects</h1>
        </div>
        <div class="announce">
          <h1>Announcements</h1>
        </div>
        <div class="trending">
          <h1>trending</h1>
        </div>
      </div>

    </div>
</body>
</html>
